version: '3.8'

services:
  # Development environment
  frontend-dev:
    build:
      context: .
      target: dev
    ports:
      - "1000:1000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  # Production environment
  frontend-prod:
    build:
      context: .
      target: prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped