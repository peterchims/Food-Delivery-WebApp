version: '3.8'

services:
  # Development environment
  frontend-dev:
    build:
      context: .
      target: dev
    ports:
      - "1000:1000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - HUSKY=0  # Disable Husky in Docker
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Production environment
  frontend-prod:
    build:
      context: .
      target: prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - HUSKY=0  # Disable Husky in production build
    restart: unless-stopped